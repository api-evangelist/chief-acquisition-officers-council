note: >-
  Supersedes a bulk-sweep scaffold dated 2026-05-04 that asserted per-minute and per-month
  limits for free / professional / enterprise tiers and a full X-RateLimit-* header set. None
  of that was published by the Council; it was a generated placeholder. Replaced here with a
  measured zero. Probes run 2026-09-05: https://www.acquisition.gov/rss.xml returned 200 with
  no RateLimit, X-RateLimit or Retry-After header; https://www.acquisition.gov/api and
  /developers returned 404, and robots.txt states no crawl-delay for the paths in scope.
