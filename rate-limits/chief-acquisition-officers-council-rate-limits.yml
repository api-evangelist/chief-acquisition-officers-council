description: >-
  The Chief Acquisition Officers Council documents no rate limits, because it operates no API.
  There is no key issuance, no quota, no throttling policy and no documented rate-limit
  response header on any surface the Council publishes. The only machine-readable thing on
  its publishing host is the site-wide RSS feed at https://www.acquisition.gov/rss.xml, which
  carries no rate-limit headers.
