description: >-
  The Chief Acquisition Officers Council publishes no plans and no pricing. It is a statutory
  interagency forum of the U.S. federal government, not a vendor: it sells nothing, meters
  nothing, and operates no API to attach a plan to. Its output — the charter, membership,
  working-group products and acquisition guidance — is published without charge or
  registration through Acquisition.GOV. This is an honest zero, not a gap.
